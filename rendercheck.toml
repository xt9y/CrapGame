[project]
name = "crapgame-lwcgl-v2"
command = "./build/debug/crapgame"
cwd = "."
baseline_dir = "rendercheck/baselines"
headless = "auto"
renderer = "auto"
timeout_ms = 60000.0
capture = true
warmup_frames = 2
pixel_threshold = 3
max_changed_percent = 0.05

[validation]
vulkan = false

[performance]
warmup_ms = 1000
sample_ms = 3000
regression_percent = 15
min_samples = 8

[[perf]]
name = "FinalScene"

# Geometry and GBuffer
[[test]]
name = "GeometryCube"

[[test]]
name = "GeometryPlane"

[[test]]
name = "Depth"

[[test]]
name = "CameraPerspective"

[[test]]
name = "Normals"

[[test]]
name = "MaterialAlbedo"

[[test]]
name = "MaterialRoughness"

[[test]]
name = "MaterialMetallic"

[[test]]
name = "MaterialEmissive"

[[test]]
name = "GBufferAlbedo"

[[test]]
name = "GBufferNormal"

[[test]]
name = "GBufferDepth"

[[test]]
name = "GBufferMaterial"

