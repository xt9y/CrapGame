name: Renderer build

on:
  push:
    paths:
      - 'Sources/**'
      - 'build.c'
      - '.github/workflows/renderer-build.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'build.c'
      - '.github/workflows/renderer-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Install lwcgl v2.9.3
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git /tmp/lwcgl
          make -C /tmp/lwcgl
          sudo make -C /tmp/lwcgl install

      - name: Install RendererCheck headers
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/xt9y/RendererCheck.git /tmp/RendererCheck
          make -C /tmp/RendererCheck
          sudo make -C /tmp/RendererCheck install

      - name: Compile CrapGame
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sources < <(find Sources -name '*.cpp' -print0)
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources -I/usr/local/include \
            "${sources[@]}" \
            -L/usr/local/lib \
            -llwcgl -lglfw -lGL -lGLU -lm -ldl -lpthread \
            -o /tmp/crapgame
