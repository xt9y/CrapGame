name: Renderer contracts

on:
  push:
    branches:
      - ci-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Performance metrics contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/performance_metrics_contract.cpp \
            Sources/Renderer/PerformanceMetrics.cpp \
            -o /tmp/performance-metrics-contract
          /tmp/performance-metrics-contract
      - name: GPU scheduling contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/gpu_scheduling_contract.cpp \
            -o /tmp/gpu-scheduling-contract
          /tmp/gpu-scheduling-contract
      - name: GPU surface format contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/gpu_surface_formats_contract.cpp \
            -o /tmp/gpu-surface-formats-contract
          /tmp/gpu-surface-formats-contract
