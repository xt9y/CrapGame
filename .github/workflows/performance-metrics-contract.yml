name: Renderer contracts

on:
  push:
    branches:
      - ci-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Performance metrics contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/performance_metrics_contract.cpp \
            Sources/Renderer/PerformanceMetrics.cpp \
            -o /tmp/performance-metrics-contract
          /tmp/performance-metrics-contract
      - name: GPU scheduling contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/gpu_scheduling_contract.cpp \
            -o /tmp/gpu-scheduling-contract
          /tmp/gpu-scheduling-contract
      - name: GPU surface format contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/gpu_surface_formats_contract.cpp \
            -o /tmp/gpu-surface-formats-contract
          /tmp/gpu-surface-formats-contract
      - name: GPU resource lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/gpu_resource_lifecycle_contract.cpp \
            -o /tmp/gpu-resource-lifecycle-contract
          /tmp/gpu-resource-lifecycle-contract
      - name: GPU camera cache contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/gpu_camera_cache_contract.cpp \
            -o /tmp/gpu-camera-cache-contract
          /tmp/gpu-camera-cache-contract
      - name: GPU presenter policy contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/gpu_presenter_policy_contract.cpp \
            -o /tmp/gpu-presenter-policy-contract
          /tmp/gpu-presenter-policy-contract
      - name: GPU frame hot path contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/gpu_frame_hot_path_contract.cpp \
            -o /tmp/gpu-frame-hot-path-contract
          /tmp/gpu-frame-hot-path-contract
      - name: GPU runtime hot path contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/gpu_runtime_hot_path_contract.cpp \
            -o /tmp/gpu-runtime-hot-path-contract
          /tmp/gpu-runtime-hot-path-contract
      - name: GPU runtime hot path v2 contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/gpu_runtime_hot_path_v2_contract.cpp \
            -o /tmp/gpu-runtime-hot-path-v2-contract
          /tmp/gpu-runtime-hot-path-v2-contract
      - name: GPU final hot path contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/gpu_final_hot_path_contract.cpp \
            -o /tmp/gpu-final-hot-path-contract
          /tmp/gpu-final-hot-path-contract
      - name: CPU reference policy contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/cpu_reference_policy_contract.cpp \
            -o /tmp/cpu-reference-policy-contract
          /tmp/cpu-reference-policy-contract
      - name: RendererCheck headless runtime contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/renderercheck_headless_contract.cpp \
            -o /tmp/renderercheck-headless-contract
          /tmp/renderercheck-headless-contract
