      - name: Contact AO Stage 71-74 sampling contract
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -ISources \
            tests/contact_ao_stage71_74_contract.cpp \
            Sources/Renderer/Lumen/Sampling.cpp \
